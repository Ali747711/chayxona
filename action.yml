name: 'Chayxona PR Cross-Review'
description: 'Automated multi-agent anti-sycophantic PR code review across Claude, Codex, and Antigravity'
author: 'Ali747711'
inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude Code CLI'
    required: false
  openai_api_key:
    description: 'OpenAI API key for Codex CLI'
    required: false
  gemini_api_key:
    description: 'Gemini / Google API key for Antigravity CLI'
    required: false
  github_token:
    description: 'GitHub token for posting comments'
    required: false
    default: ${{ github.token }}
  agents:
    description: 'Comma-separated agents to run (e.g. claude,codex,agy)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build and Install Chayxona CLI
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci
        npm run build
        npm install -g .
        npm install -g @anthropic-ai/claude-code

    - name: Run Chayxona PR Cross-Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        CHAYXONA_ARGS="--ci --post"
        if [ -n "${{ inputs.agents }}" ]; then
          CHAYXONA_ARGS="$CHAYXONA_ARGS --agents ${{ inputs.agents }}"
        fi
        chayxona pr $CHAYXONA_ARGS
